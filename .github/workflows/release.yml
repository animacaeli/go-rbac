name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: go_rbac_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        env:
          RBAC_TEST_MYSQL_DSN: root:rootpass@tcp(127.0.0.1:3306)/go_rbac_test?parseTime=true&loc=UTC&charset=utf8mb4
          RBAC_TEST_REDIS_ADDR: 127.0.0.1:6380
        run: go test -race ./repository/gormrepo/ ./cache/redis/ ./modules/tenant/

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取全量历史以便提取 CHANGELOG 区段
          fetch-depth: 0
      - name: Extract changelog section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # 提取 "## [<tag>] ..." 到下一个 "## " 之间的正文。
          # 注意：必须用 --notes-file 传递正文——CHANGELOG 含反引号，
          # 经 shell 双引号展开会被当作命令替换吞掉。
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "（$TAG 无对应 CHANGELOG 区段）" > /tmp/release_notes.md
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release_notes.md \
            --verify-tag

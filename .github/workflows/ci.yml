name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          args: ./...
      - name: Check generated mocks freshness
        run: |
          go install github.com/vektra/mockery/v3@latest
          make mocks-check

  test:
    name: Unit tests (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod 的 go 指令由依赖决定（当前 1.26）；矩阵验证最低支持版 + 最新稳定版
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Show coverage
        run: go tool cover -func=coverage.out | tail -1

  integration:
    name: Integration (MySQL ${{ matrix.mysql }} + Redis 7)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 基准 8.0（设计冻结）+ 8.4 LTS（docs/db-compatibility.md）
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: go_rbac_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests (MySQL + real Redis matrix/tenant suites)
        env:
          RBAC_TEST_MYSQL_DSN: root:rootpass@tcp(127.0.0.1:3306)/go_rbac_test?parseTime=true&loc=UTC&charset=utf8mb4
          RBAC_TEST_REDIS_ADDR: 127.0.0.1:6380
        run: go test -race -v ./internal/repository/gormrepo/ ./cache/redis/ ./modules/tenant/

      # 显式门禁：真实 Redis 原语套件（Lua SetIntMax / MGET / 故障语义）不得被
      # 静默跳过——上面的服务启动与 RBAC_TEST_REDIS_ADDR 必须真正被使用。
      - name: Real Redis primitives (guard against silent skip)
        env:
          RBAC_TEST_REDIS_ADDR: 127.0.0.1:6380
        run: |
          set -o pipefail
          go test -race -count=1 -run 'TestRealRedisSuite' -v ./cache/redis/ | tee /tmp/real-redis.log
          if grep -q -- '--- SKIP' /tmp/real-redis.log; then
            echo "real Redis primitive suite was skipped; RBAC_TEST_REDIS_ADDR not wired" >&2
            exit 1
          fi

  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
